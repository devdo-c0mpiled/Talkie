<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Talkie · 다이어그램 빌더</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>다이어그램 빌더</h1><div class="actions"><button id="example">예시 불러오기</button><label class="file">JSON 불러오기<input id="import" type="file" accept=".json,application/json"></label><button id="save">JSON 저장</button></div></header>
<main><section class="editor"><label>제목<input id="title"></label><div class="section-head"><h2>노드</h2><button id="add-node">노드 추가</button></div><div id="nodes"></div><div class="section-head"><h2>연결</h2><button id="add-edge">연결 추가</button></div><div id="edges"></div><details><summary>JSON 편집</summary><textarea id="json" aria-label="그래프 JSON" spellcheck="false"></textarea><button id="apply">JSON 적용</button></details></section>
<section class="preview"><div class="actions"><label>노드 검색<input id="search" type="search"></label><button id="play">모션 재생</button><button id="reset">상태 복원</button></div><div id="canvas" tabindex="0" aria-label="그래프 미리보기"></div><output id="selection" aria-live="polite"></output><div class="actions"><button id="render">Archify 렌더링</button><button id="download" disabled>HTML 저장</button><button id="candidate" disabled>Archify JSON 저장</button></div><output id="notice" role="status"></output><iframe id="viewer" title="Archify 미리보기" sandbox="allow-scripts allow-downloads"></iframe></section></main><script type="module" src="/app.mjs"></script></body></html>
